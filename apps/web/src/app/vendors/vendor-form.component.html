<div class="page">
  <a class="link t-mono back" routerLink="/vendors">&#8592; Vendors</a>

  <div class="head">
    <h1 class="t-display">{{ title() }}</h1>
    <p class="t-small">{{ subtitle() }}</p>
  </div>

  <div class="card form">
    <label class="field">
      <span class="t-micro">Name (required)</span>
      <input
        class="input-field"
        type="text"
        autocomplete="off"
        placeholder="Business or person name"
        [value]="name()"
        (input)="name.set(inputValue($event))"
        (keyup.enter)="save()"
      />
    </label>

    <div class="two-column">
      <label class="field">
        <span class="t-micro">Trade</span>
        <input
          class="input-field"
          type="text"
          autocomplete="off"
          placeholder="Goods or services supplied"
          [value]="trade()"
          (input)="trade.set(inputValue($event))"
        />
      </label>
      <label class="field">
        <span class="t-micro">Contact</span>
        <input
          class="input-field"
          type="text"
          autocomplete="off"
          placeholder="Contact person"
          [value]="contactName()"
          (input)="contactName.set(inputValue($event))"
        />
      </label>
    </div>

    <div class="two-column">
      <label class="field">
        <span class="t-micro">Phone</span>
        <input
          class="input-field"
          type="tel"
          autocomplete="off"
          placeholder="Phone number"
          [value]="phone()"
          (input)="phone.set(inputValue($event))"
        />
      </label>
      <label class="field">
        <span class="t-micro">Email</span>
        <input
          class="input-field"
          type="email"
          autocomplete="off"
          placeholder="Email address"
          [value]="email()"
          (input)="email.set(inputValue($event))"
        />
      </label>
      <label class="field">
        <span class="t-micro">Notes</span>
        <input
          class="input-field"
          type="text"
          autocomplete="off"
          placeholder="Optional notes"
          [value]="notes()"
          (input)="notes.set(inputValue($event))"
        />
      </label>
    </div>

    <div class="form-actions">
      <app-button [disabled]="!isValid()" [loading]="vendorService.saving()" (pressed)="save()">
        Save
      </app-button>
      <app-button variant="secondary" (pressed)="cancel()">Cancel</app-button>
    </div>

    <p class="t-small muted">Vendors are shared across all projects.</p>
  </div>
</div>
