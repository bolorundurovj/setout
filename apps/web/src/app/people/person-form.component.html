<div class="page">
  <a class="link t-mono back" routerLink="/people">&#8592; Back</a>

  <div class="head">
    <h1 class="t-display">{{ title() }}</h1>
    <p class="t-small">{{ subtitle() }}</p>
  </div>

  <div class="card form">
    <label class="field">
      <span class="t-micro">Name &middot; required</span>
      <input
        class="input-field"
        type="text"
        autocomplete="off"
        placeholder="What you call them"
        [value]="name()"
        (input)="name.set(value($event))"
        (keyup.enter)="save()"
      />
    </label>

    <div class="pair">
      <label class="field">
        <span class="t-micro">How they relate to the build</span>
        <input
          class="input-field"
          type="text"
          autocomplete="off"
          placeholder="family, site supervisor, driver"
          [value]="role()"
          (input)="role.set(value($event))"
        />
      </label>
      <label class="field">
        <span class="t-micro">Phone</span>
        <input
          class="input-field"
          type="tel"
          autocomplete="off"
          placeholder="Phone number"
          [value]="phone()"
          (input)="phone.set(value($event))"
        />
      </label>
    </div>

    <label class="field">
      <span class="t-micro">Notes</span>
      <input
        class="input-field"
        type="text"
        autocomplete="off"
        placeholder="Anything worth remembering"
        [value]="notes()"
        (input)="notes.set(value($event))"
      />
    </label>

    <div class="form-actions">
      <app-button [disabled]="!isValid()" [loading]="people.saving()" (pressed)="save()">
        Save
      </app-button>
      <app-button variant="secondary" (pressed)="cancel()">Cancel</app-button>
    </div>

    <p class="t-small muted">
      People are shared across every project, so this one will come up on any of them.
    </p>
  </div>
</div>
