name: setout

services:
  setout:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: setout:latest
    ports:
      - "${SETOUT_PORT:-8474}:8474"
    environment:
      SETOUT_DATABASE_URL: postgres://${POSTGRES_USER:-setout}:${POSTGRES_PASSWORD:-setout}@db:5432/${POSTGRES_DB:-setout}
      SETOUT_SECRET_KEY: ${SETOUT_SECRET_KEY:-change-me}
      SETOUT_STORAGE_BACKEND: s3
      SETOUT_S3_BUCKET: ${MINIO_BUCKET:-setout}
      SETOUT_S3_ENDPOINT_URL: http://minio:9000
      SETOUT_S3_REGION: us-east-1
      SETOUT_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-setout}
      SETOUT_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-setout-secret}
      SETOUT_S3_USE_PATH_STYLE: "true"
    volumes:
      - setout-data:/var/lib/setout
    depends_on:
      db:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-setout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setout}
      POSTGRES_DB: ${POSTGRES_DB:-setout}
    # 5433 on the host by default: 5432 is usually taken by a Postgres already
    # installed on the machine, and that one answers first.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - setout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setout} -d ${POSTGRES_DB:-setout}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-setout}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-setout-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - setout-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set setout http://minio:9000 '${MINIO_ROOT_USER:-setout}' '${MINIO_ROOT_PASSWORD:-setout-secret}' &&
      mc mb --ignore-existing setout/${MINIO_BUCKET:-setout}
      "

volumes:
  setout-data:
  setout-postgres:
  setout-minio:
