name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please reproduce on the latest `master` or the most recent image first.
        For a security problem, do not open an issue: see [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Add an expense with a quantity and a rate
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version from /healthz, or the commit you are on.
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it running
      options:
        - Docker compose stack
        - Docker, single container
        - From a checkout (make dev)
        - Other
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - Postgres
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Attachment storage
      options:
        - Local disk
        - S3 or compatible (MinIO, R2, B2, Spaces)
        - Not relevant to this bug
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Only if the problem is in the web app.
      placeholder: Chrome on Android, Firefox on desktop

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server log lines or browser console output. Remove anything private first.
      render: shell
