name: Back-fill Docker Hub

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Tags to copy from GHCR, space separated
        required: true
        default: 1.0.0 1.0 1.1.0 1.1.1 1.1 1.2.0 1.2 1.3.0 1.3 1.4.0 1.4 1 edge latest

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/bolorundurovj/setout

concurrency:
  group: backfill-dockerhub
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy each tag across
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'
          }

          failed=0
          echo "| Tag | Digest | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          for tag in $TAGS; do
            # sha256-* tags are the provenance attestations, not images.
            case "$tag" in
              sha256-*)
                echo "$tag: skipped, an attestation rather than an image"
                continue
                ;;
            esac

            source="$GHCR_IMAGE:$tag"
            target="$DOCKERHUB_IMAGE:$tag"

            before=$(digest_of "$source")
            if [ -z "$before" ]; then
              echo "::error::$tag is not on GHCR"
              echo "| \`$tag\` | | not on GHCR |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            if ! docker buildx imagetools create -t "$target" "$source"; then
              echo "::error::$tag failed to copy"
              echo "| \`$tag\` | \`$before\` | copy failed |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            after=$(digest_of "$target")
            if [ "$before" != "$after" ]; then
              echo "::error::$tag copied but the digests differ: $before then $after"
              echo "| \`$tag\` | \`$before\` | differs: \`$after\` |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            echo "$tag: $before"
            echo "| \`$tag\` | \`$before\` | copied |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit $failed
