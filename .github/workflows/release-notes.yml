name: Release notes

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  credit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List the authors of every commit in this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
          else
            range="$TAG"
          fi

          authors=$(git log --format='%an%x09%ae' "$range" \
            | grep -viE '\[bot\]|^(dependabot|github-actions|renovate)[[:space:]]' \
            | cut -f1 | sort -u)
          if [ -z "$authors" ]; then
            echo "No human commits in $range, release notes unchanged."
            exit 0
          fi

          # Drop a Contributors section left by an earlier run, so a rerun or a
          # re-published release does not list it twice.
          {
            gh release view "$TAG" --json body --jq .body | awk '
              /^### Contributors[[:space:]]*$/ { skip = 1; next }
              skip && /^(#|##|###) / { skip = 0 }
              skip { next }
              /^[[:space:]]*$/ { blank++; next }
              { while (blank > 0) { print ""; blank-- } print }
            '
            printf '\n### Contributors\n\n'
            echo "$authors" | sed 's/^/* /'
          } > notes.md

          gh release edit "$TAG" --notes-file notes.md
          echo "Credited:"
          echo "$authors"
