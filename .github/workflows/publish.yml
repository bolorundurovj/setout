name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# Release commits get their own group so a later push to master cannot cancel
# the release image.
concurrency:
  group: "publish-${{ startsWith(github.event.workflow_run.head_commit.message, 'chore(master): release ') && github.event.workflow_run.head_sha || 'edge' }}"
  cancel-in-progress: true

jobs:
  resolve:
    # The branches filter also matches pull requests from forks whose branch is
    # called master, so only accept pushes to this repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Find the release for this commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          version=$(printf '%s\n' "$MESSAGE" | head -n 1 \
            | sed -nE 's/^chore\(master\): release ([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*).*/\1/p')
          if [ -z "$version" ]; then
            echo "Not a release commit, publishing edge only."
            exit 0
          fi

          # release-please tags the release on the same push that started CI,
          # so the release normally exists already. Wait briefly in case not.
          for _ in $(seq 1 20); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq .tag_name >/dev/null 2>&1; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "Publishing release $version."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Release v$version was not found."
          exit 1

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SETOUT_VERSION=${{ needs.resolve.outputs.version || 'edge' }}
            SETOUT_REVISION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # An artifact path cannot hold a colon, so drop the sha256: prefix.
          # The merge job puts it back.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DOCKERHUB_IMAGE: docker.io/bolorundurovj/setout
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.HAS_DOCKERHUB }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.version }},enable=${{ needs.resolve.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.version }},enable=${{ needs.resolve.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.version }},enable=${{ needs.resolve.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Setout
            org.opencontainers.image.description=Self-hosted tracker for construction expenses on personal building projects
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Read back the digest
        id: digest
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          image_ref=$(jq -r --arg image "$GHCR_IMAGE" \
            'first(.tags[] | select(startswith($image + ":")))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "value=$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Attestation takes one subject, so it covers the primary registry only.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
