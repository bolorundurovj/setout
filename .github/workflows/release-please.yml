name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the release token is there
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # GITHUB_TOKEN cannot be used here. github-actions[bot] cannot be added
          # to a ruleset bypass list, so its pushes to a protected branch are
          # refused and it is barred from opening pull requests. RELEASE_TOKEN
          # acts as a repository admin, who is on the bypass list.
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set."
            echo "::error::Create a fine-grained token for this repository with Contents and Pull requests set to read and write, then add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Ask for an exact version when VERSION runs ahead of the last release
        run: |
          # VERSION ahead of the manifest means somebody set it on purpose, so
          # release exactly that. Equal means let the commits decide the bump.
          # This is deliberately not a diff of the push, so it survives a force
          # push and a first run, where the previous commit may not be fetched.
          released=$(jq -r '.["."]' .release-please-manifest.json)
          wanted=$(sed 's/#.*//' VERSION | tr -d '[:space:]')

          if ! printf '%s' "$wanted" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "VERSION does not hold a semantic version: $wanted"
            exit 1
          fi

          if [ "$wanted" = "$released" ]; then
            echo "VERSION matches the last release ($released), letting the commits decide."
            exit 0
          fi

          lowest=$(printf '%s\n%s\n' "$released" "$wanted" | sort -V | head -1)
          if [ "$lowest" = "$wanted" ]; then
            echo "VERSION ($wanted) is behind the last release ($released). Refusing to go backwards."
            exit 1
          fi

          # The action's release-as input is ignored in manifest mode, so ask for
          # the version the way release-please always honours: a Release-As
          # footer on a commit. It applies to this release only, so there is
          # nothing to unset afterwards.
          if last_tag=$(git describe --tags --abbrev=0 2>/dev/null); then
            range="$last_tag..HEAD"
          else
            range="HEAD"
          fi
          if git log "$range" --format='%B' | grep -q "^Release-As: $wanted$"; then
            echo "Already asked for $wanted since $range, nothing to add."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: release $wanted" -m "Release-As: $wanted"
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::error::Could not push the Release-As commit to $GITHUB_REF_NAME."
            echo "::error::RELEASE_TOKEN must belong to someone on the bypass list of the ruleset protecting this branch."
            exit 1
          fi
          echo "Asked for $wanted with a Release-As footer."

      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}
