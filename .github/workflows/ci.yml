name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: make setup

      - name: Check (lint, typecheck, tests, coverage floor)
        run: make check-parallel

      - name: SDK drift
        run: make sdk-check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Audit Python dependencies (pip-audit)
        run: |
          cd apps/api
          uv export --frozen --no-hashes --no-emit-project --output-file /tmp/setout-requirements.txt
          uvx pip-audit --no-deps -r /tmp/setout-requirements.txt

      - name: Audit JavaScript dependencies (yarn audit)
        run: yarn audit --level high

  shell-and-docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts (shellcheck)
        run: shellcheck -x scripts/*.sh

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: make setup

      - name: Read the Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox

      # make e2e runs `playwright install firefox` again, which is a no-op once
      # the browser is in place.
      - name: Install Firefox for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: yarn playwright install --with-deps firefox

      - name: Install Firefox system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: yarn playwright install-deps firefox

      - name: End-to-end tests (Firefox)
        run: make e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: setout
          POSTGRES_PASSWORD: setout
          POSTGRES_DB: setout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setout -d setout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://setout:setout@localhost:5432/setout
      CI_EXPECT_DIALECT: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install backend
        run: cd apps/api && uv sync

      - name: Integration tests against Postgres
        run: cd apps/api && uv run pytest tests/integration -m integration -n auto --dist loadfile

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SETOUT_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install backend
        run: cd apps/api && uv sync

      - name: Migrate from an empty database
        run: cd apps/api && uv run tortoise migrate

      - name: Roll back one migration and reapply it
        run: |
          make downgrade
          make migrate

      - name: Seed, then migrate again from the seeded database
        run: |
          make seed
          cd apps/api && uv run tortoise migrate

  docker-build:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the single deployment image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: setout:latest
          load: true
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Scan deployment image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: setout:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Check /healthz with the default configuration
        run: |
          docker run -d --name setout -p 8474:8474 setout:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8474/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "Server did not become healthy"
          docker logs setout
          exit 1
