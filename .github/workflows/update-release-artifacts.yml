name: Update release artifacts

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: make setup

      - name: Regenerate uv.lock
        run: cd apps/api && uv lock

      - name: Regenerate OpenAPI schema and SDK
        run: make sdk

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/uv.lock packages/api-client/openapi.json packages/api-client/src
          git diff --cached --quiet || git commit -m "chore: regenerate lockfile and sdk"
          git push origin "HEAD:${{ github.head_ref }}"
