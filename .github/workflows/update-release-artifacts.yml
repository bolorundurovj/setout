name: Update release artifacts

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    if: >-
      startsWith(github.head_ref, 'release-please--branches--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      regenerate: ${{ steps.head.outputs.regenerate }}
    steps:
      # The push below uses RELEASE_TOKEN, so it starts this workflow again
      # under that token's owner rather than github-actions[bot]. Recognise
      # the commit instead.
      - name: Skip the commit this workflow pushed
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" \
            --jq '[.commit.author.email, (.commit.message | split("\n")[0])] | @tsv')
          if [ "$commit" = "$(printf '41898282+github-actions[bot]@users.noreply.github.com\tchore: regenerate lockfile and sdk')" ]; then
            echo "Head commit was pushed by this workflow, nothing to do."
            echo "regenerate=false" >> "$GITHUB_OUTPUT"
          else
            echo "regenerate=true" >> "$GITHUB_OUTPUT"
          fi

  regenerate:
    needs: guard
    if: needs.guard.outputs.regenerate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: make setup

      - name: Regenerate uv.lock
        run: cd apps/api && uv lock

      - name: Regenerate OpenAPI schema and SDK
        run: make sdk

      - name: Commit regenerated files
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/uv.lock packages/api-client/openapi.json
          if git diff --cached --quiet; then
            echo "Lockfile and SDK are current, nothing to push."
            exit 0
          fi
          git commit -m "chore: regenerate lockfile and sdk"
          git push origin "HEAD:$HEAD_REF"
